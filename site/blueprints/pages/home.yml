title: Home

icon: 🏠

options:
  changeStatus: false

tabs:
  content:
    icon: text
    label: Contenu
    columns:
      main:
        width: 2/3
        sections:
          content:
            type: fields
            fields:
              titre:
                label: Titre
                type: blocks
                width: 1/1
                fieldsets:
                  - heading
              soustitre:
                label: Sous-titre
                type: blocks
                width: 1/1
                fieldsets:
                  - text
          episodes:
            label: Épisodes
            extends: sections/episodes
            size: small
          edito:
            type: fields
            fields:
              edito:
                label: Edito
                type: structure
                columns:
                  nom: true
                  titre: true
                  description: true
                fields:
                  nom:
                    label: Nom
                    type: text
                  titre:
                    label: Titre
                    type: text
                  description:
                    label: Description
                    type: textarea
      media:
        width: 1/3
        sections:
          images:
            type: fields
            fields:
              cover:
                label: Cover
                type: files
                width: 1/1
                max: 1
                uploads:
                  template: image
              image1:
                label: Image 1
                type: files
                width: 1/1
                max: 1
                uploads:
                  template: image
              image2:
                label: Image 2
                type: files
                width: 1/1
                max: 1
                uploads:
                  template: image

  secondaire:
    icon: settings
    label: Secondaire
    type: fields
    fields:
      loader_message:
        label: Message du loader
        type: text
        placeholder: Chargement de l'experience immersive...
        help: Message affiche sous le logo dans le loader de la page d'accueil.

  seo: seo/page
